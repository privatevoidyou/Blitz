[package]
name = "blitz"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "Blitz"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
slint = { version = "1.8", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell",
  "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_SystemInformation",
  "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Security" ] }

[build-dependencies]
slint-build = "1.8"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
