name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  RELEASE_TAG: build-5
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Size
        shell: pwsh
        run: |
          New-Item -ItemType Directory target\release -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\Blitz.exe target\release\Blitz.exe -Force
          $s = (Get-Item target\release\Blitz.exe).Length
          "Blitz.exe size: $s bytes ($([math]::Round($s/1MB,2)) MB)" | Tee-Object -FilePath size.txt
          if ($s -ge 10MB) { throw "Blitz.exe exceeds the single-digit MB size budget" }
      - name: E2E tests
        shell: pwsh
        run: ./tests/e2e.ps1
      - name: Screenshots
        shell: pwsh
        run: ./tests/screenshots.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            screenshot-*.png
            e2e-results.txt
            size.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with: { name: Blitz-exe, path: target/release/Blitz.exe }
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Blitz 疾风加速 ${{ env.RELEASE_TAG }}
          make_latest: true
          body: |
            整行统一勾选；首页仅保留手动添加的快捷方式，支持从已安装程序选择或添加 .lnk / .exe。
            修复启动点击被遮挡，增加系统/关键进程保护、保存窗口保留、白名单与未选中进程保护；内存整理仅作用于本工具和所选程序。
            Windows CI 检查：cargo test、clippy -D warnings、真实进程 e2e；保持 Rust 单文件托盘程序。
          files: |
            target/release/Blitz.exe
            screenshot-procs.png
            e2e-results.txt
            size.txt
