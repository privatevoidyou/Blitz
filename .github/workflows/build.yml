name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  RELEASE_TAG: build-3
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Clippy
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Size
        shell: pwsh
        run: |
          New-Item -ItemType Directory target\release -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\Blitz.exe target\release\Blitz.exe -Force
          $s = (Get-Item target\release\Blitz.exe).Length
          "Blitz.exe size: $s bytes ($([math]::Round($s/1MB,2)) MB)" | Tee-Object -FilePath size.txt
      - name: E2E tests
        shell: pwsh
        run: ./tests/e2e.ps1
      - name: Screenshots
        shell: pwsh
        continue-on-error: true
        run: ./tests/screenshots.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            screenshot-*.png
            e2e-results.txt
            size.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with: { name: Blitz-exe, path: target/release/Blitz.exe }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Blitz 疾风加速 ${{ env.RELEASE_TAG }}
          make_latest: true
          files: target/release/Blitz.exe
